name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Lint + Playwright list
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: List Playwright tests
        run: npx playwright test --list

      # Live UI/SSH against customer envs requires secrets — not on core CI.
      # Project forks/branches can add a job that sources GitHub Actions secrets
      # and runs: npm run test:smoke
