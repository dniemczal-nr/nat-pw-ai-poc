# UNIQA project overlay (template — no secrets).
# On branch `project/uniqa`:
#   cp config/projects/uniqa.example.properties config/local.properties
#   cp projects/uniqa/env.example .env
# Fill passwords / keys in .env only (gitignored). Do not merge secrets to main.

ProjectName=UNIQA
application.environment=uniqa-qa
dns.domain=symphonyai.dev

# NetReveal 9.6 QA (EIM) — public login URL; credentials via .env
ui.basePath=/netreveal/login.do
ui.baseUrl=https://nr-qa-uniqa.symphonyai.dev/netreveal/login.do
ui.browser=chromium
ui.headless=true

userDataAdminUsername=admin
# USER_DATA_ADMIN_PASSWORD / USER_DATA_DEFAULT_PASSWORD → .env

# Optional SSH batch (fill host when available)
# ssh.host=
# ssh.user=ec2-user
# SSH_KEYFILE → .env
