########## NR multi-project template ##########
# Copy config/projects/example.properties → config/local.properties (gitignored)
# or set ENV keys (ui.baseUrl, APPLICATION_ENVIRONMENT, SSH_KEYFILE, …).
# Placeholders ${key} resolve from this map; ${ENV_NAME} also falls back to process.env.

ProjectName=CHANGE_ME
dns.domain=example.nr.local

######## Common ########
application.port=8080
application.environment=default
application.hostname=ui-lb.${application.environment}.${dns.domain}

######## UI (NetReveal product paths — same across projects) ########
ui.basePath=/netreveal/login.do
ui.baseUrl=https://ui-lb.${application.environment}.${dns.domain}:${application.port}${ui.basePath}
ui.browser=chromium
ui.headless=true

########## USER_DATA ##########
# Prefer ENV overrides in real environments (do not commit production secrets).
userDataAdminUsername=admin
userDataAdminPassword=${USER_DATA_ADMIN_PASSWORD}
userDataDefaultPassword=${USER_DATA_DEFAULT_PASSWORD}
userDataPassword1=${USER_DATA_PASSWORD1}

# Optional generic auth keys
auth.username=defaultUser
auth.password=${AUTH_PASSWORD}

######## SSH (batch) ########
ssh.host=batch.${application.environment}.${dns.domain}
ssh.port=22
ssh.user=ec2-user
ssh.keyFile=${SSH_KEYFILE}

######## Optional infrastructure stubs (override per project) ########
batchServerUserName=${ssh.user}
batchServerHost=${ssh.host}
batchServerPrivateKeyLocalPath=${ssh.keyFile}
batchServerPort=${ssh.port}

kafkaRestUrl=
DbConnectionString=
DbUsername=
DbPassword=${DB_PASSWORD}
DbDriverName=

app.baseUrl=
api.baseUrl=
db.host=
db.port=
db.user=
db.name=
mq.host=
mq.port=
mq.topic=
