########## NR multi-project template ##########
# Copy config/projects/example.properties → config/local.properties (gitignored)
# or set ENV keys (ui.baseUrl, APPLICATION_ENVIRONMENT, SSH_KEYFILE, …).
# Placeholders ${key} resolve from this map; ${ENV_NAME} also falls back to process.env.

ProjectName=CHANGE_ME
dns.domain=example.nr.local

######## Common ########
application.port=8080
application.environment=default
application.hostname=ui-lb.${application.environment}.${dns.domain}

######## UI (NetReveal product paths — same across projects) ########
ui.basePath=/netreveal/login.do
ui.baseUrl=https://ui-lb.${application.environment}.${dns.domain}:${application.port}${ui.basePath}
ui.browser=chromium
ui.headless=true

########## USER_DATA ##########
# Prefer ENV overrides in real environments (do not commit production secrets).
userDataAdminUsername=admin
userDataAdminPassword=${USER_DATA_ADMIN_PASSWORD}
userDataDefaultPassword=${USER_DATA_DEFAULT_PASSWORD}
userDataPassword1=${USER_DATA_PASSWORD1}

# Optional generic auth keys
auth.username=defaultUser
auth.password=${AUTH_PASSWORD}

######## SSH (batch) ########
ssh.host=batch.${application.environment}.${dns.domain}
ssh.port=22
ssh.user=ec2-user
ssh.keyFile=${SSH_KEYFILE}

######## REST real-time messages (Services Manager processMessage) ########
# OAuth client-credentials token: Basic clientId:clientSecret → access_token
rest.tokenUrl=${OAUTH_TOKEN_URL}
rest.clientId=${OAUTH_CLIENT_ID}
rest.clientSecret=${OAUTH_CLIENT_SECRET}
rest.rt.processUrl=${CDD_ENDPOINT_URL}
# Message files (<Message> blocks); ${RUN_ID} inside a message is replaced per send
rest.rt.messagesDir=test-data/rt

######## MinIO — batch data interface (S3 API) ########
# Acquisition envelopes land in <minio.bucket>/<minio.acquisitionPrefix>/waiting/; rejects in .../feedback/
minio.host=${MINIO_HOST}
minio.port=${MINIO_PORT}
minio.accessKey=${MINIO_USER}
minio.secretKey=${MINIO_PASSWORD}
minio.region=us-east-1
minio.bucket=public-bucket
minio.acquisitionPrefix=landing/acquisition
# Batch specs upload envelopes to shared QA and use up an envelope date: opt in per run
BATCH_ENABLED=false

######## DB read access through AdminerEvo (single SELECT only) ########
dbAdmin.url=${DB_ADMIN_URL}
dbAdmin.driver=pgsql
dbAdmin.name=${DB_NAME}
dbAdmin.user=${DB_USER}
dbAdmin.password=${DB_PASSWORD}

######## Optional infrastructure stubs (override per project) ########
batchServerUserName=${ssh.user}
batchServerHost=${ssh.host}
batchServerPrivateKeyLocalPath=${ssh.keyFile}
batchServerPort=${ssh.port}

kafkaRestUrl=
DbConnectionString=
DbUsername=
DbPassword=${DB_PASSWORD}
DbDriverName=

app.baseUrl=
api.baseUrl=
db.host=
db.port=
db.user=
db.name=
mq.host=
mq.port=
mq.topic=
