########## ENVIRONMENTS ##########
ProjectName=BEAST

######## Common ########
application.port=24200
application.environment=default
application.hostname=ui-lb.${application.environment}.reyl.fs.caws.local
kafkaRestUrl=http://kafka.hub.reyl.fs.caws.local:8082/v3/clusters/MkU3OEVBNTcwNTJENDM2Qk/topics/${application.environment}_nr-applications/records

######## Database ########
DbConnectionString=jdbc:oracle:thin:@db.reyl.fs.caws.local:1521/ORA190DV
DbUsername=REYL_${application.environment}
DbPassword=${DB_PASSWORD}
DbDriverName=oracle.jdbc.driver.OracleDriver

######## Batch Server ########
batchServerUserName=ec2-user
batchServerHost=batch.${application.environment}.reyl.fs.caws.local
batchServerPrivateKeyLocalPath=./testFiles/sshKeys/PRJ-ISP-Key.ppk
batchServerPort=22

######## SMBD Server ########
smbdServerUserName=ec2-user
smbdServerHost=smbd-rtde.${application.environment}.reyl.fs.caws.local
smbdServerPrivateKeyLocalPath=./testFiles/sshKeys/PRJ-ISP-Key.ppk
smbdServerPort=22

######## RT1 #######
rtServerHost=rt1.${application.environment}.reyl.fs.caws.local

######## RT2 #######
rt2ServerHost=rt2.${application.environment}.reyl.fs.caws.local

######## UI1 #######
uiServerHost=ui1.${application.environment}.reyl.fs.caws.local

######## UI2 #######
ui2ServerHost=ui2.${application.environment}.reyl.fs.caws.local

######## RT-LB #######
rtLbServerHost=rt-lb.${application.environment}.reyl.fs.caws.local

########## USER_DATA ##########
userDataAdminPassword=${USERDATA_ADMIN_PASSWORD}
userDataDefaultPassword=${USERDATA_DEFAULT_PASSWORD}
userDataPassword1=${USERDATA_PASSWORD1}

# Phase 1 scaffold - default configuration

# Application URLs
app.baseUrl=https://ui.default.myapp.local/
api.baseUrl=https://api.default.myapp.local/

# UI (Phase 3)
ui.basePath=/netreveal/login.do
ui.baseUrl=https://ui-lb.${application.environment}.reyl.fs.caws.local:${application.port}${ui.basePath}
ui.browser=chromium
ui.headless=true

# Auth (password comes from process.env.AUTH_PASSWORD)
auth.username=defaultUser
auth.password=${AUTH_PASSWORD}

# Database
db.host=db.default.myapp.local
db.port=5432
db.user=default_db_user
db.name=defaultdb

# SSH (project-level fixed key path)
ssh.host=batch.qa2.reyl.fs.caws.local
ssh.port=22
ssh.user=ec2-user
ssh.keyFile=./config/PRJ-ISP-Key.ppk

# MQ
mq.host=mq.default.myapp.local
mq.port=9092
mq.topic=default-topic
